name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ceres_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run unit tests
      run: cargo test --verbose --lib --bins
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceres_test

    - name: Run integration tests
      run: cargo test --verbose --test '*'
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceres_test
        # testcontainers uses Docker daemon which is available on ubuntu-latest

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ceres_container
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      - name: Build CLI and server image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ceres-ci:latest
          build-args: |
            CERES_GIT_SHA=${{ github.sha }}

      - name: Verify image provenance
        shell: bash
        run: |
          VERSION=$(docker run --rm ceres-ci:latest ceres --version)
          grep -F "commit: ${GITHUB_SHA:0:7}" <<<"${VERSION}"

      - name: Prepare finite CKAN batch fixture
        run: |
          mkdir -p .ci-smoke/http/api/3/action
          printf '%s\n' '{"success":true,"result":{"count":0,"results":[]}}' > .ci-smoke/http/api/3/action/package_search
          printf '%s\n' '[[portals]]' 'name = "ci-fixture"' 'url = "http://127.0.0.1:18080"' 'type = "ckan"' 'enabled = true' > .ci-smoke/portals.toml
          python3 -m http.server 18080 --directory .ci-smoke/http > /tmp/ceres-fixture.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/api/3/action/package_search

      - name: Run unattended migration and batch job from the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ceres_container
          -e PORTALS_CONFIG=/etc/ceres/portals.toml
          -e CERES_MIGRATE_ON_START=true
          -v "$PWD/.ci-smoke/portals.toml:/etc/ceres/portals.toml:ro"
          ceres-ci:latest ceres-job --concurrency 1
